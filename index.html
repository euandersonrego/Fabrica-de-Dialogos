<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fábrica de shorts - Herói interativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://css.gg/css?=|music" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ytred: '#FF0000',
                        darkbg: '#0F0F0F',
                        cardbg: '#1A1A1A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0F0F0F;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0F0F0F; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        input, select, textarea {
            appearance: none;
            background-color: #272727 !important;
            border: 1px solid #3F3F3F !important;
            color: white !important;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #FF0000 !important;
            box-shadow: 0 0 0 1px #FF0000 !important;
            outline: none;
        }
        input:read-only, textarea:read-only {
            background-color: #1a1a1a !important;
            cursor: text;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(156, 163, 175, 0.4) !important; 
            font-style: italic;
        }

        .btn-confirm {
            background-color: #10b981 !important;
            color: white !important;
            transform: scale(0.98);
        }
        
        .ai-glow {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.15);
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.7), 0 0 10px rgba(255, 0, 0, 0.5); }
            50% { text-shadow: 0 0 10px rgba(255, 0, 0, 1), 0 0 20px rgba(255, 0, 0, 0.7); }
        }
        .title-animated { animation: titlePulse 4s infinite ease-in-out; }
    </style>
</head>
<body class="text-white pb-12"> 
    
    <header class="bg-cardbg/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-50 flex flex-col sm:flex-row justify-between items-center shadow-lg gap-4">
        <div class="text-center sm:text-left">
            <h1 class="text-xl sm:text-2xl font-oswald text-ytred tracking-wide title-animated">Fábrica de shorts</h1>
            <p class="text-xs text-gray-400 font-medium tracking-wider">Herói interativo</p>
        </div>
        <div class="flex flex-wrap justify-center sm:justify-end items-center gap-2 w-full sm:w-auto">
            <a href="https://chatgpt.com/" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-bold transition flex-1 sm:flex-none text-center">Abrir ChatGPT</a>
            <a href="https://labs.google/fx/pt/tools/flow" target="_blank" class="bg-green-600 hover:bg-green-700 text-white text-xs px-4 py-2 rounded-lg font-bold transition flex-1 sm:flex-none text-center">Abrir Flow</a>
            <button id="clearBtn" class="bg-zinc-800 hover:bg-red-900 text-white text-xs px-4 py-2 rounded-lg font-bold transition flex-1 sm:flex-none text-center">Limpar tudo</button>
        </div>
    </header>

    <main class="flex-1 w-full p-4 sm:p-6">
        <div class="max-w-7xl mx-auto">
            
            <div class="flex bg-zinc-900 rounded-xl p-1 mb-6 border border-zinc-800 lg:hidden shadow-lg">
                <a href="#step1" class="flex-1 py-3 text-sm font-bold rounded-lg text-center bg-zinc-800 text-white transition mr-1">Ir para roteiro</a>
                <a href="#step2" class="flex-1 py-3 text-sm font-bold rounded-lg text-center bg-zinc-800 text-white transition ml-1">Ir para prompts</a>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">

                <div id="step1" class="space-y-6 p-5 border border-zinc-800 rounded-2xl bg-cardbg shadow-2xl">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-ytred oswald tracking-widest">Passo 1: Gerar roteiro</h2>
                        <p class="text-xs text-gray-400 mt-1">Crie a história base para a sua audiência</p>
                    </div>
                    
                    <div class="p-5 bg-zinc-900 rounded-2xl border border-zinc-800 ai-glow">
                        <label class="block text-xs font-bold text-ytred mb-2 tracking-wider">Filtro mestre de franquias</label>
                        <select id="masterFranchiseFilter" class="w-full rounded-xl p-4 text-sm font-bold cursor-pointer transition">
                            <option value="Todas as Franquias">Todas as franquias (modo livre)</option>
                        </select>
                    </div>

                    <div class="flex bg-zinc-900 rounded-xl p-1 border border-zinc-800">
                        <button id="modeCreativeBtn" class="flex-1 py-3 text-sm font-bold rounded-lg bg-zinc-700 text-white transition">Modo criativo (imagens)</button>
                        <button id="modeTemplateBtn" class="flex-1 py-3 text-sm font-bold rounded-lg text-gray-400 transition">Modelos prontos (vídeos)</button>
                    </div>

                    <div id="creativeModeContainer" class="bg-zinc-900/50 p-5 rounded-2xl border border-zinc-800/50 space-y-5">
                        <div class="flex gap-2 mb-2">
                            <button id="modeRapid" class="flex-1 py-2 text-xs font-bold rounded-lg bg-zinc-700 text-white border border-zinc-600 transition">Rápido</button>
                            <button id="modeAdvanced" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 border border-zinc-800 transition">Avançado</button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Herói principal</label>
                                <input type="text" id="charName" list="charName-list" class="w-full rounded-xl p-3 text-sm" placeholder="Ex: Goku">
                                <datalist id="charName-list"></datalist>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Universo</label>
                                <input type="text" id="charUniverse" list="charUniverse-list" class="w-full rounded-xl p-3 text-sm" placeholder="Ex: Dragon ball">
                                <datalist id="charUniverse-list"></datalist>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Co-protagonista</label>
                                <input type="text" id="coStar" list="coStar-list" class="w-full rounded-xl p-3 text-sm" placeholder="Ex: Vegeta">
                                <datalist id="coStar-list"></datalist>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">Vilão</label>
                                <input type="text" id="villain" list="villain-list" class="w-full rounded-xl p-3 text-sm" placeholder="Ex: Freeza">
                                <datalist id="villain-list"></datalist>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs text-gray-400 mb-1">Tipo de enredo</label>
                                <select id="plotType" class="w-full rounded-xl p-3 text-sm">
                                    <optgroup label="Estruturas clássicas">
                                        <option value="jornada_heroi">Jornada do herói</option>
                                        <option value="superando_monstro">Superando o monstro</option>
                                        <option value="de_mendigo_a_rei">De mendigo a rei</option>
                                        <option value="treinamento_infernal">Treinamento infernal</option>
                                    </optgroup>
                                    <optgroup label="Comédia">
                                        <option value="micro_comedia_absurda">Micro-comédia absurda (estilo shorts 15s)</option>
                                        <option value="comedia_erros">Comédia de erros</option>
                                        <option value="parodia">Paródia e sátira de animes</option>
                                        <option value="slice_of_life_engracado">Cotidiano engraçado</option>
                                    </optgroup>
                                    <optgroup label="Tragédia e drama">
                                        <option value="tragedia">Tragédia (a queda do herói)</option>
                                        <option value="sacrificio_heroico">Sacrifício heroico</option>
                                        <option value="vinganca">Busca por vingança</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs text-gray-400 mb-1">Tom emocional</label>
                                <select id="emotionalTone" class="w-full rounded-xl p-3 text-sm">
                                    <optgroup label="Positivos e energéticos">
                                        <option value="epico_heroico">Épico e heroico</option>
                                        <option value="inspirador_motivacional">Inspirador e motivacional</option>
                                        <option value="cheio_de_adrenalina">Cheio de adrenalina</option>
                                        <option value="comico_engracado">Cômico e engraçado</option>
                                    </optgroup>
                                    <optgroup label="Negativos e sombrios">
                                        <option value="sombrio_ameacador">Sombrio e ameaçador</option>
                                        <option value="suspense_tensao">Suspense e tensão</option>
                                        <option value="triste_melancolico">Triste e melancólico</option>
                                    </optgroup>
                                </select>
                            </div>

                            <div id="advancedFields1" class="hidden sm:col-span-2 space-y-4">
                                 <div>
                                    <label class="block text-xs text-gray-400 mb-1">Localização</label>
                                    <input type="text" id="location" list="location-list" class="w-full rounded-xl p-3 text-sm" placeholder="Ex: Planeta Namekusei">
                                    <datalist id="location-list"></datalist>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1">Elemento surpresa</label>
                                    <input type="text" id="crossoverElement" list="crossoverElement-list" class="w-full rounded-xl p-3 text-sm" placeholder="Ex: Um power ranger">
                                    <datalist id="crossoverElement-list"></datalist>
                                </div>
                            </div>
                            <div id="advancedFields2" class="hidden sm:col-span-2 space-y-4">
                                 <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs text-gray-400 mb-1">Duração</label>
                                        <select id="scriptDuration" class="w-full rounded-xl p-3 text-sm">
                                            <option value="60s">Padrão (~60s)</option>
                                            <option value="30s">Curto (~30s)</option>
                                            <option value="90s">Longo (~90s)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-400 mb-1">Nível de risco</label>
                                        <select id="riskLevel" class="w-full rounded-xl p-3 text-sm">
                                            <option value="moderado">Moderado</option>
                                            <option value="alto">Alto (perigo real)</option>
                                            <option value="extremo">Extremo</option>
                                        </select>
                                    </div>
                                 </div>
                                 <div>
                                    <label class="block text-xs text-gray-400 mb-1">Objeto chave</label>
                                    <input type="text" id="keyObject" list="keyObject-list" class="w-full rounded-xl p-3 text-sm">
                                    <datalist id="keyObject-list"></datalist>
                                </div>
                                 <div>
                                    <label class="block text-xs text-gray-400 mb-1">Estilo da chamada para ação (cta)</label>
                                    <select id="ctaStyle" class="w-full rounded-xl p-3 text-sm">
                                        <option value="ajuda_urgente">Preciso da sua ajuda agora</option>
                                        <option value="barra_de_poder">Minha energia está acabando</option>
                                        <option value="like_para_ataque_final">Sua curtida é o meu ataque final</option>
                                        <option value="junte-se_a_luta">Junte-se à luta se inscrevendo</option>
                                        <option value="vote_no_proximo_capitulo">Vote no que acontece a seguir</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1">Gancho inicial psicológico</label>
                                    <select id="psychologicalHook" class="w-full rounded-xl p-3 text-sm">
                                        <option value="curiosidade">Curiosidade (padrão)</option>
                                        <option value="polemica">Polêmica e controvérsia</option>
                                        <option value="quebra_de_padrao">Quebra de padrão (absurdo)</option>
                                        <option value="medo_urgencia">Medo e urgência</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-zinc-800 pt-4 mt-2">
                            <label class="block text-xs text-ytred font-bold mb-2">Arsenal de frases</label>
                            <select id="catchphraseSelect" class="w-full rounded-xl p-3 text-sm mb-2" disabled>
                                <option>Escolha um herói primeiro</option>
                            </select>
                            <input type="text" id="catchphraseInput" class="w-full rounded-xl p-3 text-sm" placeholder="Ou digite a sua frase de efeito...">
                        </div>
                    </div>

                    <div id="templateModeContainer" class="hidden bg-zinc-900/50 p-5 rounded-2xl border border-zinc-800/50 space-y-4">
                        <label class="block text-xs text-ytred font-bold mb-1">Modelo selecionado</label>
                        <select id="templateSelector" class="w-full rounded-xl p-3 text-sm font-semibold text-ytred"></select>
                        <div id="templateFieldsContainer" class="space-y-4 mt-4"></div>
                        
                        <div id="lullabyResultArea" class="hidden space-y-4 mt-4 border-t border-zinc-800 pt-4">
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-bold text-ytred">Título:</label>
                                    <button id="copyLullabyTitleBtn" class="bg-zinc-700 text-white text-xs px-3 py-1 rounded-md">Copiar</button>
                                </div>
                                <textarea id="lullabyTitleResult" rows="2" class="w-full rounded-xl p-3 text-sm font-mono text-zinc-300" readonly></textarea>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-bold text-ytred">Descrição e hashtags:</label>
                                    <button id="copyLullabyDescBtn" class="bg-zinc-700 text-white text-xs px-3 py-1 rounded-md">Copiar</button>
                                </div>
                                <textarea id="lullabyDescResult" rows="5" class="w-full rounded-xl p-3 text-sm font-mono text-zinc-300" readonly></textarea>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-bold text-ytred">Canção de ninar:</label>
                                    <button id="copyLullabySongBtn" class="bg-zinc-700 text-white text-xs px-3 py-1 rounded-md">Copiar</button>
                                </div>
                                <textarea id="lullabySongResult" rows="5" class="w-full rounded-xl p-3 text-sm font-mono text-zinc-300" readonly></textarea>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-bold text-ytred">Prompt para chatgpt:</label>
                                    <button id="copyLullabyPromptsBtn" class="bg-zinc-700 text-white text-xs px-3 py-1 rounded-md">Copiar</button>
                                </div>
                                <textarea id="lullabyPromptsResult" rows="15" class="w-full rounded-xl p-3 text-sm font-mono text-zinc-300" readonly></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-4 border-t border-zinc-800">
                        <button id="surpriseBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white text-sm font-bold py-4 rounded-xl active:scale-95 transition border border-zinc-700">Aleatório</button>
                        <button id="generateBtn" class="w-full bg-ytred hover:bg-red-700 text-white text-sm font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(255,0,0,0.3)] active:scale-95 transition">Gerar roteiro</button>
                    </div>

                    <div id="scriptPromptResultArea" class="hidden bg-zinc-900 p-4 rounded-2xl border border-ytred/50 ai-glow transition-all duration-500">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-2">
                            <label class="text-xs font-bold text-ytred tracking-wider">Prompt gerado (copie e cole no chatgpt)</label>
                            <button id="copyScriptPromptBtn" class="bg-ytred text-white text-xs px-4 py-2 rounded-md hover:bg-red-700 font-bold transition shadow-lg w-full sm:w-auto text-center">
                                Copiar e ir para passo 2
                            </button>
                        </div>
                        <textarea id="scriptPromptResult" rows="8" class="w-full rounded-xl p-4 text-sm font-mono text-zinc-300 mb-4 bg-black border border-zinc-800" readonly></textarea>
                    </div>
                </div>

                <div id="step2" class="space-y-6 p-5 border border-zinc-800 rounded-2xl bg-cardbg shadow-2xl">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-ytred oswald tracking-widest">Passo 2: Geração visual</h2>
                        <p class="text-xs text-gray-400 mt-1">Transforme seu roteiro em arte e vídeo</p>
                    </div>
                    
                    <div class="bg-zinc-900/50 p-5 rounded-2xl border border-zinc-800/50">
                        <label class="block text-xs font-bold text-ytred mb-2">1. Cole o roteiro final do chatgpt aqui</label>
                        <textarea id="pasteScriptArea" rows="8" class="w-full rounded-xl p-4 text-sm bg-black border border-zinc-700 focus:border-ytred focus:ring-1 focus:ring-ytred transition-all duration-300" placeholder="Após gerar a história no chatgpt, cole o texto do roteiro aqui..."></textarea>
                        
                        <label class="block text-xs font-bold text-ytred mt-6 mb-2">2. Estilo visual da arte</label>
                        <div class="flex gap-3 items-center">
                            <select id="imageStyle" class="flex-1 rounded-xl p-3 text-sm font-medium">
                                <option value="estilo de arte de anime vibrante">Anime vibrante</option>
                                <option value="estilo anime sakuga experimental, traço de rascunho cru, linhas rabiscadas frenéticas, iluminação de alto contraste extremo, sombras pretas sólidas pesadas, energia caótica visceral, distorção anatômica para movimento, paleta de cores limitada">Sakuga experimental</option>
                                <option value="filmagem cinematográfica em live-action, atores humanos reais com proporções naturais, textura de pele ultra-realista com poros e imperfeições naturais, iluminação cinematográfica física com sombras naturais, profundidade de campo real, desfoque de fundo orgânico, fotorrealista, sem anime, sem desenho">Live-action (ultra-realista)</option>
                                <option value="realista, hiper detalhado, resolução 8k">Realista e hiper-realista</option>
                                <option value="estilo chibi, fofo, olhos grandes">Estilo chibi e fofo</option>
                                <option value="estilo de painel de mangá em preto e branco, tons de tela">Estilo mangá (preto e branco)</option>
                                <option value="pintura digital, fantasia, pinceladas detalhadas">Pintura digital fantasia</option>
                                <option value="ilustração em aquarela, cores suaves">Ilustração em aquarela</option>
                                <option value="estilo de arte studio ghibli, fundo pintado">Estilo studio ghibli</option>
                                <option value="arte de fantasia sombria, gótica, iluminação dramática">Sombrio e gótico</option>
                                <option value="estilo pixel art 8-bits">Pixel art (8-bits)</option>
                                <option value="estilo de desenho animado matinal dos anos 90">Desenho infantil (anos 90)</option>
                                <option value="estilo de animação 3d, estilo pixar, estilo disney, renderização 8k, iluminação cinematográfica, vibrante">Animação 3d</option>
                            </select>
                            <img id="imageStylePreview" src="" class="w-14 h-14 rounded-lg object-cover border border-zinc-600 bg-black">
                        </div>
                        
                        <button id="analyzeScriptBtn" class="w-full mt-6 bg-ytred text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(255,0,0,0.2)] active:scale-95 transition">
                            Gerar comandos para chatgpt (imagem e vídeo)
                        </button>
                    </div>

                    <div id="finalPromptsArea" class="hidden space-y-6">
                        
                        <div id="imagePromptSection" class="bg-zinc-900 p-5 rounded-2xl border border-ytred/40 ai-glow">
                            <div class="flex justify-between items-center mb-3">
                                <label class="text-xs font-bold text-ytred tracking-wider">Comando visual para o chatgpt</label>
                                <button id="copyImagePromptBtn" class="bg-zinc-700 text-white text-xs px-3 py-1 rounded-md hover:bg-zinc-600 font-bold transition">Copiar tudo</button>
                            </div>
                            <textarea id="imagePromptResult" class="w-full rounded-xl p-4 text-sm font-mono text-zinc-300 bg-black border border-zinc-800" rows="12" readonly></textarea>
                        </div>
                        
                        <div id="metadataPromptSection" class="bg-zinc-900 p-5 rounded-2xl border border-zinc-700 mt-6">
                             <div class="flex justify-between items-center mb-3">
                                <label class="text-xs font-bold text-ytred tracking-wider">Título e descrição seo</label>
                                <button id="copyMetadataPromptBtn" class="bg-zinc-700 text-white text-xs px-3 py-1 rounded-md hover:bg-zinc-600 font-bold transition">Copiar</button>
                            </div>
                            <textarea id="metadataPromptResult" class="w-full rounded-xl p-4 text-sm font-mono text-zinc-300 bg-black border border-zinc-800" rows="6" readonly></textarea>
                        </div>
                    </div>

                    <div id="soundtrackSection" class="hidden bg-zinc-900 p-5 rounded-2xl border border-teal-900/50 mt-6">
                        <div class="flex items-center justify-center mb-4 text-teal-400">
                            <i class="gg-music mr-2"></i>
                            <h3 class="text-xs font-bold tracking-widest">Maestro de trilha sonora</h3>
                        </div>
                        <button id="soundtrackBtn" class="w-full bg-teal-600/20 text-teal-400 border border-teal-600/30 hover:bg-teal-600/40 font-bold py-3 rounded-xl transition">
                            Sugerir busca de música
                        </button>
                        <div id="soundtrackResultArea" class="hidden mt-4">
                            <textarea id="soundtrackResult" rows="3" class="w-full rounded-xl p-3 text-sm text-teal-100/70 bg-black border border-teal-900/50" readonly></textarea>
                            <button id="copySoundtrackPromptBtn" class="w-full mt-2 bg-teal-900/50 hover:bg-teal-900/70 text-teal-400 text-xs py-3 rounded-xl font-bold transition">Copiar termo de busca</button>
                        </div>
                    </div>

                </div>
            </div>
            
        </div>
    </main>

    <script>

            const primordialRule = `\n\nREGRA PRIMORDIAL E OBRIGATÓRIA DA NARRATIVA:\nToda história, roteiro ou narrativa gerada deve OBRIGATORIAMENTE possuir uma estrutura clara e lógica contendo: INÍCIO (contexto e gancho), MEIO (desenvolvimento e conflito), CTA (Chamada para Ação bem posicionada, quando aplicável) e FIM (conclusão fechada e com sentido lógico). É estritamente proibido entregar histórias sem nexo, piadas soltas e desconexas, pular partes cruciais da história ou terminar o roteiro abruptamente sem um final resolvido. A coerência do início ao fim é a prioridade absoluta da sua geração.`;

            function populateDatalist(listId, items) {
                const datalist = document.getElementById(listId);
                if(datalist) {
                    datalist.innerHTML = '';
                    const uniqueItems = [...new Set(items)];
                    uniqueItems.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item;
                        datalist.appendChild(option);
                    });
                }
            }

            function populateMasterFilter() {
                const universes = [...new Set(surpriseOptions.characters.map(c => c.universe))].filter(Boolean).sort();
                universes.forEach(uni => {
                    const option = document.createElement('option');
                    option.value = uni;
                    option.textContent = uni;
                    masterFranchiseFilter.appendChild(option);
                });
            }

            function updateDatalistsBasedOnFilter() {
                const selectedUniverse = masterFranchiseFilter.value;
                let filteredChars = surpriseOptions.characters;

                if (selectedUniverse !== 'Todas as Franquias') {
                    filteredChars = surpriseOptions.characters.filter(c => c.universe === selectedUniverse);
                }

                const allNamesInUniverse = [...new Set([
                    ...filteredChars.map(c => c.name),
                    ...filteredChars.map(c => c.coStar),
                    ...filteredChars.map(c => c.villain)
                ])].filter(n => n && n !== '-' && n !== 'N/A').sort();

                populateDatalist('charName-list', allNamesInUniverse);
                populateDatalist('charUniverse-list', [...new Set(filteredChars.map(c => c.universe))]);
                populateDatalist('coStar-list', allNamesInUniverse);
                populateDatalist('villain-list', allNamesInUniverse);
            }

            masterFranchiseFilter.addEventListener('change', () => {
                updateDatalistsBasedOnFilter();
                charNameInput.value = '';
                coStarInput.value = '';
                villainInput.value = '';
                if (masterFranchiseFilter.value !== 'Todas as Franquias') {
                    charUniverseInput.value = masterFranchiseFilter.value;
                } else {
                    charUniverseInput.value = '';
                }
                updateCatchphraseDropdown();
            });

            function initializeDatalists() {
                updateDatalistsBasedOnFilter(); 
                populateDatalist('location-list', surpriseOptions.locations);
                populateDatalist('keyObject-list', surpriseOptions.keyObjects);
                populateDatalist('crossoverElement-list', surpriseOptions.crossovers);
            }
            
            populateMasterFilter(); 
            initializeDatalists();

            function handleAutofill() {
                const selectedName = charNameInput.value.trim();
                const characterData = surpriseOptions.characters.find(c => c.name.toLowerCase() === selectedName.toLowerCase());

                if (characterData) {
                    charUniverseInput.value = characterData.universe || '';
                    coStarInput.value = characterData.coStar || '';
                    villainInput.value = characterData.villain || '';
                }
                updateCatchphraseDropdown();
            }

            function updateImagePreview() {
                const imageStyleSelect = document.getElementById('imageStyle');
                const selectedStyle = imageStyleSelect.value;
                const imageUrl = imageStylePreviews[selectedStyle];
                if (imageUrl) {
                    imageStylePreview.src = imageUrl;
                }
            }
            
            charNameInput.addEventListener('change', handleAutofill);
            document.getElementById('imageStyle').addEventListener('change', updateImagePreview);
            updateImagePreview();

            function switchMainMode(mode) {
                currentMode = mode;
                const isCreative = mode === 'creative';

                modeCreativeBtn.classList.toggle('bg-zinc-700', isCreative);
                modeCreativeBtn.classList.toggle('text-white', isCreative);
                modeCreativeBtn.classList.toggle('text-gray-400', !isCreative);

                modeTemplateBtn.classList.toggle('bg-zinc-700', !isCreative);
                modeTemplateBtn.classList.toggle('text-white', !isCreative);
                modeTemplateBtn.classList.toggle('text-gray-400', isCreative);

                creativeModeContainer.classList.toggle('hidden', !isCreative);
                templateModeContainer.classList.toggle('hidden', isCreative);
            }

            function populateTemplateSelector() {
                templateSelector.innerHTML = '';
                for (const key in storyTemplates) {
                    const option = document.createElement('option');

                document.getElementById('metadataPromptSection').classList.remove('hidden');
                document.getElementById('soundtrackSection').classList.remove('hidden');
                
                showConfirmation(analyzeScriptBtn, 'Comandos gerados!');
                setTimeout(() => { document.getElementById('imagePromptSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            }

            analyzeScriptBtn.addEventListener('click', handleScriptAnalysis);

            catchphraseSelect.addEventListener('change', () => { catchphraseInput.value = catchphraseSelect.value; });
            
            soundtrackBtn.addEventListener('click', () => {
                const scriptText = pasteScriptArea.value.trim();
                if (!scriptText) {
                    soundtrackResult.value = 'Cole e analise um roteiro para obter uma sugestão de trilha sonora.';
                } else {
                    soundtrackResult.value = generateSoundtrackPrompt();
                }
                document.getElementById('soundtrackResultArea').classList.remove('hidden');
            });

            clearBtn.addEventListener('click', () => {
                const inputs = [
                    charNameInput, charUniverseInput, coStarInput, villainInput, 
                    locationInput, keyObjectInput, crossoverElementInput, 
                    pasteScriptArea, scriptPromptResult, imagePromptResult, 
                    metadataPromptResult, catchphraseInput, soundtrackResult,
                    document.getElementById('lullabyTitleResult'),
                    document.getElementById('lullabyDescResult'),
                    document.getElementById('lullabySongResult'),
                    document.getElementById('lullabyPromptsResult')
                ];
                
                inputs.forEach(i => { if(i) i.value = ''; });
                
                const selects = [masterFranchiseFilter, plotTypeSelect, scriptDurationSelect, emotionalToneSelect, ctaStyleSelect, document.getElementById('riskLevel'), document.getElementById('psychologicalHook')];
                selects.forEach(s => s.selectedIndex = 0);
                
                masterFranchiseFilter.value = 'Todas as Franquias';
                updateDatalistsBasedOnFilter();

                scriptPromptResultArea.classList.add('hidden');
                document.getElementById('lullabyResultArea').classList.add('hidden');
                finalPromptsArea.classList.add('hidden');
                catchphraseSelect.innerHTML = '<option>Escolha um herói primeiro</option>';
                catchphraseSelect.disabled = true;
                document.getElementById('soundtrackSection').classList.add('hidden');
                document.getElementById('soundtrackResultArea').classList.add('hidden');
                document.getElementById('charUniverse').dataset.currentUniverse = '';
                toggleCreativeMode(true);
                switchMainMode('creative');
                generateTemplateFields(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function copyAndScrollToPaste(elementValue, buttonEl) {
                copyToClipboard(elementValue, buttonEl);
                const pasteArea = document.getElementById('pasteScriptArea');
                pasteArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                    pasteArea.focus();
                    pasteArea.classList.add('ring-2', 'ring-ytred');
                    setTimeout(() => pasteArea.classList.remove('ring-2', 'ring-ytred'), 1500);
                }, 500);
            }

            copyScriptPromptBtn.addEventListener('click', () => copyAndScrollToPaste(scriptPromptResult.value, copyScriptPromptBtn));
            copyImagePromptBtn.addEventListener('click', () => copyToClipboard(imagePromptResult.value, copyImagePromptBtn));
            copyMetadataPromptBtn.addEventListener('click', () => copyToClipboard(metadataPromptResult.value, copyMetadataPromptBtn));
            copySoundtrackPromptBtn.addEventListener('click', () => copyToClipboard(soundtrackResult.value, copySoundtrackPromptBtn));
            
            document.getElementById('copyLullabySongBtn').addEventListener('click', () => copyToClipboard(document.getElementById('lullabySongResult').value, document.getElementById('copyLullabySongBtn')));
            document.getElementById('copyLullabyTitleBtn').addEventListener('click', () => copyToClipboard(document.getElementById('lullabyTitleResult').value, document.getElementById('copyLullabyTitleBtn')));
            document.getElementById('copyLullabyDescBtn').addEventListener('click', () => copyToClipboard(document.getElementById('lullabyDescResult').value, document.getElementById('copyLullabyDescBtn')));
            document.getElementById('copyLullabyPromptsBtn').addEventListener('click', () => copyToClipboard(document.getElementById('lullabyPromptsResult').value, document.getElementById('copyLullabyPromptsBtn')));

            function toggleCreativeMode(isRapid) {
                if (isRapid) {
                    modeRapid.classList.add('bg-zinc-700', 'text-white'); modeRapid.classList.remove('text-gray-400');
                    modeAdvanced.classList.remove('bg-zinc-700', 'text-white'); modeAdvanced.classList.add('text-gray-400');
                    advancedFields1.classList.add('hidden'); advancedFields2.classList.add('hidden');
                } else {
                    modeAdvanced.classList.add('bg-zinc-700', 'text-white'); modeAdvanced.classList.remove('text-gray-400');
                    modeRapid.classList.remove('bg-zinc-700', 'text-white'); modeRapid.classList.add('text-gray-400');
                    advancedFields1.classList.remove('hidden'); advancedFields2.classList.remove('hidden');
                }
            }
            
            function showError(buttonElement, message, originalText) {
                const originalBg = buttonElement.className;
                buttonElement.textContent = message;
                buttonElement.classList.add('bg-yellow-500', 'hover:bg-yellow-600', 'text-black');
                 setTimeout(() => {
                    buttonElement.textContent = originalText;
                    buttonElement.className = originalBg;
                }, 2000);
            }

            function showConfirmation(buttonElement, message) {
                const originalText = buttonElement.textContent;
                buttonElement.textContent = message;
                buttonElement.classList.add('btn-confirm');
                setTimeout(() => {
                    buttonElement.textContent = originalText;
                    buttonElement.classList.remove('btn-confirm');
                }, 2000);
            }

            function copyToClipboard(text, buttonElement) {
                if (!text) return;
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                const originalText = buttonElement.innerHTML;
                buttonElement.innerHTML = 'Copiado!';
                setTimeout(() => { buttonElement.innerHTML = originalText; }, 2000);
            }

            function updateCatchphraseDropdown() {
                const selectedName = charNameInput.value.trim();
                const characterData = surpriseOptions.characters.find(c => c.name.toLowerCase() === selectedName.toLowerCase());
                catchphraseSelect.innerHTML = ''; 
                catchphraseInput.value = '';

                if (characterData && characterData.catchphrases && characterData.catchphrases.length > 0) {
                    catchphraseSelect.disabled = false;
                    const defaultOption = document.createElement('option');
                    defaultOption.textContent = 'Selecione uma frase de efeito...';
                    defaultOption.value = '';
                    catchphraseSelect.appendChild(defaultOption);

                    characterData.catchphrases.forEach(phrase => {
                        const option = document.createElement('option');
                        option.value = phrase;
                        option.textContent = `"${phrase}"`;
                        catchphraseSelect.appendChild(option);
                    });
                } else {
                    catchphraseSelect.disabled = true;
                    const option = document.createElement('option');
                    option.textContent = 'Nenhuma frase encontrada';
                    catchphraseSelect.appendChild(option);
                }
            }

            function generateCreativePrompt() {
                const riskLevelSelect = document.getElementById('riskLevel');
                const psychologicalHookSelect = document.getElementById('psychologicalHook');
                const catchphraseValue = document.getElementById('catchphraseInput').value.trim();

                const data = {
                    charName: document.getElementById('charName').value.trim(),
                    charUniverse: document.getElementById('charUniverse').value.trim(),
                    coStar: document.getElementById('coStar').value.trim(),
                    villain: document.getElementById('villain').value.trim(),
                    plotType: document.getElementById('plotType').options[document.getElementById('plotType').selectedIndex].text,
                    duration: document.getElementById('scriptDuration').value,
                    emotionalTone: document.getElementById('emotionalTone').options[document.getElementById('emotionalTone').selectedIndex].text,
                    location: document.getElementById('location').value.trim(),
                    keyObject: document.getElementById('keyObject').value.trim(),
                    crossover: document.getElementById('crossoverElement').value.trim(),
                    ctaStyle: document.getElementById('ctaStyle').options[document.getElementById('ctaStyle').selectedIndex].text,
                    riskLevel: riskLevelSelect.options[riskLevelSelect.selectedIndex].text, 
                    psychologicalHook: psychologicalHookSelect.options[psychologicalHookSelect.selectedIndex].text,
                    catchphrase: catchphraseValue
                };

                const durationMap = {
                    '30s': 'extremamente curto e impactante de 30 segundos',
                    '60s': 'de aproximadamente 60 segundos',
                    '90s': 'mais elaborado de 90 segundos'
                };

                let targetDuration = durationMap[data.duration];
                let characters = [data.charName, data.coStar, data.villain].filter(Boolean).join(', ');

                let context = '';
                if (data.location) context += `\nLocal: a história se passa em ${data.location}.`;
                if (data.keyObject) context += `\nElemento chave: o diálogo deve girar em torno de ${data.keyObject}.`;
                if (data.crossover) context += `\nElemento surpresa: a história deve envolver de forma inesperada: ${data.crossover}.`;

                const rules = [];

                if (data.plotType === 'Micro-comédia absurda (estilo shorts 15s)') {
                    targetDuration = 'ultra-rápido de exatamente 15 segundos';
                    rules.push(`O gancho verbal e visual (0 a 1 segundo): o vídeo não tem introdução. Comece no meio da ação ou problema. Não faça saudações.`);
                    rules.push(`Diálogo ultra curto e acelerado: a narrativa deve ser frenética. Cada personagem fala no máximo uma ou duas vezes.`);
                    rules.push(`Estrutura das falas: cada fala deve expressar mais de uma ideia. Separe as ideias apenas com vírgulas e coloque um único ponto no final da fala. Não gere respostas de uma única palavra.`);
                    rules.push(`Quebra de padrão: injete uma virada cômica absurda nos primeiros segundos.`);
                    rules.push(`Chamada para ação (obrigatório): a última fala deve atuar como a piada final, contendo obrigatoriamente um convite para inscrição.`);
                } else {
                    rules.push(`Ordem suprema e lógica: a história deve seguir uma sequência lógica respeitando os personagens (${characters}), universo (${data.charUniverse}) e tom (${data.emotionalTone}). Crie uma narrativa original.`);
                    rules.push(`Gancho viral: inicie o roteiro com um gancho usando o gatilho psicológico de "${data.psychologicalHook}" para reter a atenção nos primeiros segundos.`);
                    rules.push(`Conexão emocional: o herói deve lutar por algo maior, criando identificação imediata.`);
                    rules.push(`Estrutura narrativa:\n  - Ato 1: o problema.\n  - Ato 2: desespero e falsa derrota.\n  - Ato 3: vitória com a participação do espectador. O vilão deve ter uma fala de derrota.\n  - Ato 4: gancho final para a audiência.`);
                    rules.push(`Sequência de engajamento no clímax:\n  1. O herói pede ajuda à audiência usando o estilo "${data.ctaStyle}".\n  2. O vilão interrompe zombando do espectador.\n  3. O herói responde pedindo a inscrição para calar o vilão.`);
                }
                
                if (data.catchphrase) {
                    const cleanCatchphrase = data.catchphrase.replace(/"/g, '');
                    rules.push(`Frase de efeito: integre a frase "${cleanCatchphrase}" no momento de maior impacto, se fizer sentido na história.`);
                }

                const formattedRules = rules.map((rule, index) => `${index + 1}. ${rule}`).join('\n');

                return `Aja como especialista em narrativa visual e crie um roteiro de diálogo ${targetDuration}. Tudo deve ser gerado em português do Brasil, sem utilizar palavras estrangeiras quando não necessário.\n\nUniverso: ${data.charUniverse}.\nPersonagens: ${characters}.\nEnredo: ${data.plotType}.\nTom emocional: ${data.emotionalTone}.${context}\nNível de risco: ${data.riskLevel}.\n\nRegras estratégicas obrigatórias:\n${formattedRules}\n${scriptOutputRules}`;
            }
            
            function generateMetadataPrompt(scriptText, charName, charUniverse) {
                return `Aja como especialista em otimização para mídias sociais.\nCrie um título, uma descrição curta e tags em português do Brasil com base neste roteiro:\n\n"${scriptText}"\n\nRegras de formato:\n1. Título: curto e chocante, máximo de 70 caracteres.\n2. Descrição: duas a três frases criando mistério sobre a história. Finalize obrigatoriamente com a frase Inscreva-se para a parte 2.\n3. Tags: uma linha única de palavras-chave, separadas por vírgula.\n4. Não adicione emojis em nenhuma parte do texto gerado.`;
            }

            function generateSoundtrackPrompt() {
                const templateKey = document.getElementById('templateSelector').value;
                
                if (templateKey === 'batalha_video_ai' || templateKey === 'desafio_casamento_vid' || templateKey === 'micro_comedia_15s' || templateKey === 'ranking_comico') {
                    return "Não utilize trilha sonora alta neste formato. O áudio gerado nativamente já deve conter dublagem. Adicione no editor de vídeo apenas uma faixa instrumental muito baixa ao fundo. Foque muito nos efeitos sonoros (Sons de meme, pancadas, glitches).";
                }
                if (templateKey === 'historia_visual_muda') {
                    return "Para o modelo história muda, NÃO DEVE HAVER TRILHA SONORA. Utilize apenas efeitos sonoros de ambiente e ASMR (passos, respiração ofegante, vento, impactos, detalhes de tecido) para criar uma imersão profunda apenas com áudio posicional 3D.";
                }

                const tone = document.getElementById('emotionalTone').value;
                const universeInput = document.getElementById('charUniverse');
                const universe = universeInput.dataset.currentUniverse || universeInput.value.trim();
                
                let prompt = 'Para este roteiro, busque na biblioteca de áudio por: ';
                if (universe) prompt += `música épica similar ao universo de ${universe}. `;

                switch(tone) {
                    case 'epico_heroico': prompt += 'Tema orquestral heroico e com coro de vozes.'; break;
                    case 'inspirador_motivacional': prompt += 'Música cinematográfica motivacional e inspiradora.'; break;
                    case 'cheio_de_adrenalina': prompt += 'Rock eletrônico de ritmo muito acelerado.'; break;
                    case 'comico_engracado': prompt += 'Música de desenho animado, leve e engraçada.'; break;
                    case 'sombrio_ameacador': prompt += 'Música de suspense atmosférica e tema de chefe final.'; break;
                    case 'suspense_tensao': prompt += 'Cordas cinematográficas criando alta tensão.'; break;
                    case 'triste_melancolico': prompt += 'Música de piano lenta, triste e com forte carga emocional.'; break;
                    default: prompt += 'Música de fundo cinematográfica livre de direitos.'; break;
                }
                return prompt;
            }
        });
    </script>
